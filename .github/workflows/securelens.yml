name: SecureLens Gate

# Runs on PRs: scans the diff target, comments findings, blocks on critical.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # needed to post the findings comment

jobs:
  securelens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt

      - name: Run SecureLens scan + gate
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONARQUBE_HOST: ${{ secrets.SONARQUBE_HOST }}
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        # Exit code 1 fails the job -> branch protection blocks merge on critical.
        run: python -m scripts.ci_scan ..
