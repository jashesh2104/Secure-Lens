name: SecureLens Gate

# Runs on PRs: scans the diff target, comments findings, blocks on critical.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # needed to post the findings comment

jobs:
  securelens:
    runs-on: ubuntu-latest
    # SONARQUBE_HOST/TOKEN live at the job level so the SonarQube step's
    # `if: env.SONARQUBE_HOST != ''` guard can read them (a step's own
    # step-level env is not visible to that same step's if condition).
    env:
      SONARQUBE_HOST: ${{ secrets.SONARQUBE_HOST }}
      SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt

      # SonarQube is SKIPPED until SonarQube is deployed to EC2 and the
      # SONARQUBE_HOST secret is added to this repo. While the secret is empty
      # this whole step is skipped; once the secret is set it runs automatically.
      - name: SonarQube scan
        if: env.SONARQUBE_HOST != ''
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from app.services import sonarqube_runner
          key = os.environ.get("GITHUB_REPOSITORY", "local").replace("/", "_")
          try:
              sonarqube_runner.run_scanner("..", key)
              sonarqube_runner.wait_for_ce_task(key)  # wait for async CE
              issues = sonarqube_runner.fetch_issues(key)
          except Exception as exc:
              print(f"sonar skipped: {exc}")
              issues = []
          json.dump(issues, open("sonar.json", "w"))
          PY

      # Gitleaks always runs — secret scanning has no external dependency.
      - name: Gitleaks scan
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from app.services import gitleaks_runner
          try:
              leaks = gitleaks_runner.run_gitleaks("..")
          except Exception as exc:
              print(f"gitleaks skipped: {exc}")
              leaks = []
          json.dump(leaks, open("leaks.json", "w"))
          PY

      # Post whatever findings exist (Gitleaks-only if SonarQube was skipped) and
      # gate the merge. Never fails silently: with zero findings it still posts a
      # "No findings detected" comment. Exit code 1 blocks merge on critical.
      - name: Post PR comment + gate
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os
          from app.models.finding import Finding
          from app.services import github_pr, normalizer

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except FileNotFoundError:
                  return []

          sonar, leaks = load("sonar.json"), load("leaks.json")
          findings = [Finding(**fc.model_dump())
                      for fc in normalizer.normalize(sonar, leaks, "..")]
          body = (github_pr.render_comment(findings) if findings
                  else "## SecureLens\n\nNo findings detected.")
          print(body)

          repo, pr = os.environ.get("GITHUB_REPOSITORY"), os.environ.get("PR_NUMBER")
          if repo and pr:
              github_pr.post_pr_comment(repo, int(pr), body)
          raise SystemExit(1 if github_pr.severity_gate(findings) else 0)
          PY
